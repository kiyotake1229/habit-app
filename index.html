<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6C5CE7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="コツコツ">
<title>コツコツ — 習慣＆タスク</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --accent:#6C5CE7; --accent2:#a29bfe;
  --bg:#f4f5f9; --card:#ffffff; --card2:#f7f8fc;
  --text:#1a1c2e; --sub:#8a8fa3; --line:#eceef4;
  --good:#00c896; --warn:#ff7675; --gold:#ffb400;
  --shadow:0 6px 24px rgba(30,34,72,.08);
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
:root[data-theme="dark"]{
  --bg:#0f1018; --card:#1a1c28; --card2:#22243450;
  --text:#f2f3f8; --sub:#888ca0; --line:#282b3a;
  --shadow:0 6px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:var(--bg); color:var(--text);
  overscroll-behavior-y:none; -webkit-user-select:none; user-select:none;
  transition:background .3s;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
#app{max-width:520px;margin:0 auto;min-height:100%;position:relative;padding-bottom:calc(84px + var(--safe-b))}

/* ---- Header ---- */
header{padding:calc(16px + var(--safe-t)) 20px 8px;display:flex;align-items:center;justify-content:space-between}
.h-title{font-size:26px;font-weight:800;letter-spacing:-.5px}
.h-date{font-size:13px;color:var(--sub);font-weight:600;margin-top:2px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);transition:transform .15s}
.icon-btn:active{transform:scale(.9)}

/* ---- Screens ---- */
.screen{display:none;padding:0 16px;animation:fade .35s}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---- Today summary ring ---- */
.summary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:24px;padding:20px;margin:8px 4px 18px;color:#fff;display:flex;align-items:center;gap:18px;box-shadow:0 10px 30px rgba(108,92,231,.35);position:relative;overflow:hidden}
.summary::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;background:rgba(255,255,255,.12);border-radius:50%}
.ring{width:76px;height:76px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:800}
.summary-txt h2{font-size:19px;font-weight:800;margin-bottom:3px}
.summary-txt p{font-size:13px;opacity:.9;font-weight:500}

/* ---- Section ---- */
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;margin-top:6px}
.sec-head h3{font-size:15px;font-weight:800}
.sec-head .cnt{font-size:12px;color:var(--sub);font-weight:700;background:var(--card);padding:2px 9px;border-radius:20px}

/* ---- Item card ---- */
.list{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.item{background:var(--card);border-radius:18px;padding:14px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow);transition:transform .15s,opacity .3s;position:relative;overflow:hidden}
.item:active{transform:scale(.985)}
.item .em{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;flex:none}
.item-body{flex:1;min-width:0}
.item-body .nm{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.3s}
.item-body .meta{font-size:12px;color:var(--sub);font-weight:600;margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.streak{display:inline-flex;align-items:center;gap:3px;color:var(--gold);font-weight:800}
.chip{background:var(--card2);padding:2px 8px;border-radius:10px}
.check{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--line);flex:none;display:grid;place-items:center;transition:.25s;background:transparent}
.check svg{opacity:0;transform:scale(.4);transition:.25s;stroke:#fff}
.item.done .check{background:var(--good);border-color:var(--good)}
.item.done .check svg{opacity:1;transform:scale(1)}
.item.done .nm{color:var(--sub);text-decoration:line-through}
.item.done{opacity:.72}
.item.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}

/* ---- Empty ---- */
.empty{text-align:center;padding:50px 20px;color:var(--sub)}
.empty .big{font-size:44px;margin-bottom:10px}
.empty p{font-size:14px;font-weight:600;line-height:1.7}

/* ---- FAB ---- */
.fab{position:fixed;bottom:calc(96px + var(--safe-b));right:calc(50% - 250px);z-index:40;width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(108,92,231,.45);transition:transform .2s}
.fab:active{transform:scale(.9) rotate(90deg)}
@media(max-width:540px){.fab{right:22px}}

/* ---- Tab bar ---- */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px 0 var(--safe-b);max-width:520px;margin:0 auto;backdrop-filter:blur(10px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--sub);transition:color .2s;font-size:10px;font-weight:700}
.tab svg{width:24px;height:24px;transition:transform .2s}
.tab.on{color:var(--accent)}
.tab.on svg{transform:translateY(-2px)}

/* ---- Stats ---- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 4px 16px}
.stat-card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.stat-card .v{font-size:28px;font-weight:800;line-height:1}
.stat-card .l{font-size:12px;color:var(--sub);font-weight:700;margin-top:6px}
.stat-card .v small{font-size:14px;color:var(--sub);font-weight:700}
.cal{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin:0 4px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cal-head b{font-size:16px;font-weight:800}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:32px;height:32px;border-radius:10px;background:var(--card2);display:grid;place-items:center}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.dow span{text-align:center;font-size:11px;color:var(--sub);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--sub);position:relative}
.cell.pad{visibility:hidden}
.cell.today{outline:2px solid var(--accent);outline-offset:-2px}
.cell .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%}
.per-item{margin-top:16px}
.per-row{background:var(--card);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:8px;box-shadow:var(--shadow)}
.per-row .em{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;flex:none}
.per-row .info{flex:1;min-width:0}
.per-row .info .nm{font-size:14px;font-weight:700}
.bar{height:7px;border-radius:5px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;transition:width .6s}
.per-row .pc{font-size:13px;font-weight:800;flex:none}

/* ---- Modal ---- */
.mask{position:fixed;inset:0;background:rgba(10,12,24,.5);z-index:50;opacity:0;pointer-events:none;transition:.3s;backdrop-filter:blur(3px)}
.mask.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-radius:26px 26px 0 0;padding:8px 20px calc(24px + var(--safe-b));max-width:520px;margin:0 auto;transform:translateY(100%);transition:transform .35s cubic-bezier(.3,.8,.4,1);max-height:90vh;overflow-y:auto}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 16px}
.sheet h3{font-size:20px;font-weight:800;margin-bottom:18px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:8px}
.field input[type=text]{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card2);font-size:16px;color:var(--text);font-weight:600;transition:border .2s}
.field input:focus{outline:none;border-color:var(--accent)}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;border-radius:11px;font-size:14px;font-weight:700;color:var(--sub);transition:.2s}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.emoji-pick{display:flex;gap:8px;flex-wrap:wrap}
.emoji-pick button{width:44px;height:44px;border-radius:12px;font-size:22px;background:var(--card2);display:grid;place-items:center;transition:.15s;border:2px solid transparent}
.emoji-pick button.on{border-color:var(--accent);transform:scale(1.08)}
.color-pick{display:flex;gap:10px}
.color-pick button{width:36px;height:36px;border-radius:50%;transition:.15s;position:relative}
.color-pick button.on{transform:scale(1.15)}
.color-pick button.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2.5px solid var(--text)}
.dows{display:flex;gap:6px}
.dows button{flex:1;aspect-ratio:1;border-radius:12px;background:var(--card2);font-size:13px;font-weight:700;color:var(--sub);transition:.15s}
.dows button.on{background:var(--accent);color:#fff}
.save-btn{width:100%;padding:16px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:16px;font-weight:800;box-shadow:0 6px 18px rgba(108,92,231,.4);transition:transform .15s;margin-top:6px}
.save-btn:active{transform:scale(.97)}
.del-btn{width:100%;padding:14px;border-radius:14px;color:var(--warn);font-size:15px;font-weight:700;margin-top:10px}
input[type=date]{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card2);font-size:16px;color:var(--text);font-weight:600}

/* toast */
.toast{position:fixed;bottom:calc(100px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:12px 22px;border-radius:16px;font-size:14px;font-weight:700;z-index:80;opacity:0;pointer-events:none;transition:.3s;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;width:10px;height:10px;z-index:70;pointer-events:none;border-radius:2px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="h-title" id="hTitle">今日</div>
      <div class="h-date" id="hDate"></div>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="テーマ切替"></button>
  </header>

  <!-- 今日 -->
  <section class="screen active" id="s-today">
    <div class="summary">
      <div class="ring">
        <svg width="76" height="76">
          <circle cx="38" cy="38" r="32" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="7"/>
          <circle id="ringFg" cx="38" cy="38" r="32" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="201"/>
        </svg>
        <div class="pct" id="ringPct">0%</div>
      </div>
      <div class="summary-txt">
        <h2 id="sumTitle">今日のスタート！</h2>
        <p id="sumSub">習慣を追加してみよう</p>
      </div>
    </div>
    <div id="todayContent"></div>
  </section>

  <!-- 統計 -->
  <section class="screen" id="s-stats">
    <div class="stat-grid" id="statGrid"></div>
    <div class="cal">
      <div class="cal-head">
        <b id="calLabel"></b>
        <div class="cal-nav">
          <button id="calPrev">‹</button>
          <button id="calNext">›</button>
        </div>
      </div>
      <div class="dow"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
      <div class="grid" id="calGrid"></div>
    </div>
    <div class="per-item" id="perItem"></div>
  </section>
</div>

<button class="fab" id="fab" aria-label="追加">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabbar">
  <button class="tab on" data-tab="today">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    今日
  </button>
  <button class="tab" data-tab="stats">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="8"/><rect x="12" y="6" width="3" height="12"/><rect x="17" y="13" width="3" height="5"/></svg>
    統計
  </button>
</nav>

<!-- add/edit sheet -->
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <h3 id="sheetTitle">新しい習慣</h3>
  <div class="field">
    <label>種類</label>
    <div class="seg" id="typeSeg">
      <button data-type="habit" class="on">習慣（毎日つづける）</button>
      <button data-type="task">タスク（1回だけ）</button>
    </div>
  </div>
  <div class="field">
    <label>名前</label>
    <input type="text" id="nameIn" placeholder="例：水を2L飲む" maxlength="24">
  </div>
  <div class="field">
    <label>アイコン</label>
    <div class="emoji-pick" id="emojiPick"></div>
  </div>
  <div class="field">
    <label>カラー</label>
    <div class="color-pick" id="colorPick"></div>
  </div>
  <div class="field" id="repeatField">
    <label>くり返す曜日</label>
    <div class="dows" id="dowPick"></div>
  </div>
  <div class="field" id="dueField" style="display:none">
    <label>期限（任意）</label>
    <input type="date" id="dueIn">
  </div>
  <button class="save-btn" id="saveBtn">保存する</button>
  <button class="del-btn" id="delBtn" style="display:none">削除する</button>
</div>

<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const EMOJIS=["💧","🏃","📚","🧘","🥗","💪","😴","🦷","🧹","✍️","🎯","☀️","💊","🚭","🧠","🎸"];
const COLORS=["#6C5CE7","#00c896","#ff7675","#ffb400","#0984e3","#e84393","#00b894","#636e72"];
const DOW=["日","月","火","水","木","金","土"];
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dstr=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

let state=load();
function load(){try{return JSON.parse(localStorage.getItem("kotsu_v1"))||{items:[],theme:null}}catch(e){return{items:[],theme:null}}}
function save(){localStorage.setItem("kotsu_v1",JSON.stringify(state))}

/* theme */
function applyTheme(){
  const t=state.theme|| (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  document.documentElement.setAttribute("data-theme",t);
  $("#themeBtn").innerHTML = t==="dark"
    ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
    : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
}
$("#themeBtn").onclick=()=>{const cur=document.documentElement.getAttribute("data-theme");state.theme=cur==="dark"?"light":"dark";save();applyTheme();};

/* scheduled today? */
function scheduledToday(it,dateStr){
  const d=dateStr?new Date(dateStr+"T00:00:00"):new Date();
  if(it.type==="task") return !it.done || Object.keys(it.done).length===0 ? true : (it.due? it.due>=dstr(d):false);
  const dow=d.getDay();
  return it.repeat==="daily"||(Array.isArray(it.repeat)&&it.repeat.includes(dow));
}
function isDone(it,ds){return it.done&&it.done[ds]}

/* streak for habit */
function streak(it){
  if(it.type!=="habit")return 0;
  let s=0;const d=new Date();
  for(let i=0;i<400;i++){
    const ds=dstr(d);const dow=d.getDay();
    const sched=it.repeat==="daily"||(Array.isArray(it.repeat)&&it.repeat.includes(dow));
    if(sched){
      if(isDone(it,ds))s++;
      else if(ds!==todayStr())break; // today not done yet -> don't break
      else if(ds===todayStr()){} // allow today pending
    }
    d.setDate(d.getDate()-1);
  }
  return s;
}

/* ---- render today ---- */
function renderToday(){
  const ds=todayStr();
  const habits=state.items.filter(it=>it.type==="habit"&&scheduledToday(it));
  const tasks=state.items.filter(it=>it.type==="task"&&!(it.done&&it.done.__done));
  const all=[...habits,...tasks];
  const doneCount=habits.filter(it=>isDone(it,ds)).length + tasks.filter(it=>it.done&&it.done.__done).length;
  const total=all.length;
  const pct=total?Math.round(doneCount/total*100):0;

  // ring
  const off=201-201*pct/100;
  $("#ringFg").style.strokeDashoffset=off;
  $("#ringPct").textContent=pct+"%";
  if(total===0){$("#sumTitle").textContent="はじめよう";$("#sumSub").textContent="右下の＋で習慣を追加";}
  else if(pct===100){$("#sumTitle").textContent="全部達成！お見事 🎉";$("#sumSub").textContent="この調子でつづけよう";}
  else{$("#sumTitle").textContent=`あと ${total-doneCount} 件`;$("#sumSub").textContent=`${total}件中 ${doneCount}件クリア`;}

  const c=$("#todayContent");
  if(total===0){c.innerHTML=`<div class="empty"><div class="big">🌱</div><p>まだ何もありません。<br>下の＋ボタンから<br>習慣やタスクを追加しましょう。</p></div>`;return;}
  let html="";
  if(habits.length){
    html+=`<div class="sec-head"><h3>習慣</h3><span class="cnt">${habits.filter(it=>isDone(it,ds)).length}/${habits.length}</span></div><div class="list">`;
    habits.forEach(it=>html+=itemCard(it,isDone(it,ds)));
    html+=`</div>`;
  }
  if(tasks.length){
    html+=`<div class="sec-head"><h3>タスク</h3><span class="cnt">${tasks.filter(it=>it.done&&it.done.__done).length}/${tasks.length}</span></div><div class="list">`;
    tasks.forEach(it=>html+=itemCard(it,it.done&&it.done.__done));
    html+=`</div>`;
  }
  c.innerHTML=html;
}
function itemCard(it,done){
  const st=streak(it);
  let meta="";
  if(it.type==="habit"){
    meta=it.repeat==="daily"?"毎日":it.repeat.map(d=>DOW[d]).join("・");
    if(st>0)meta=`<span class="streak">🔥${st}日</span> <span class="chip">${meta}</span>`;
    else meta=`<span class="chip">${meta}</span>`;
  }else{
    meta = it.due?`<span class="chip">📅 ${it.due.slice(5).replace("-","/")}</span>`:`<span class="chip">タスク</span>`;
  }
  return `<div class="item ${done?"done":""}" data-id="${it.id}">
    <div class="em" style="background:${it.color}22;color:${it.color}">${it.emoji}</div>
    <div class="item-body"><div class="nm">${esc(it.name)}</div><div class="meta">${meta}</div></div>
    <button class="check" data-check="${it.id}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 6"/></svg></button>
  </div>`;
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* toggle done */
document.addEventListener("click",e=>{
  const chk=e.target.closest("[data-check]");
  if(chk){
    e.stopPropagation();
    const it=state.items.find(x=>x.id===chk.dataset.check);
    const ds=todayStr();
    it.done=it.done||{};
    let nowDone;
    if(it.type==="task"){nowDone=!it.done.__done;it.done.__done=nowDone;if(nowDone)it.done[ds]=true;}
    else{nowDone=!it.done[ds];if(nowDone)it.done[ds]=true;else delete it.done[ds];}
    save();
    const card=chk.closest(".item");
    if(nowDone){card.classList.add("pop");burst(chk);}
    renderToday();
    // 100% celebration
    setTimeout(()=>{const p=$("#ringPct").textContent;if(p==="100%"&&nowDone)celebrate();},50);
    return;
  }
  const card=e.target.closest(".item");
  if(card&&card.dataset.id){openEdit(card.dataset.id);}
});

/* ---- Stats ---- */
let calCursor=new Date();
function renderStats(){
  const habits=state.items.filter(it=>it.type==="habit");
  // 総ストリーク最大
  let maxStreak=0,totalDone=0;
  habits.forEach(it=>{maxStreak=Math.max(maxStreak,streak(it));totalDone+=Object.keys(it.done||{}).filter(k=>k!=="__done").length;});
  state.items.filter(it=>it.type==="task").forEach(it=>{if(it.done&&it.done.__done)totalDone++;});
  // 今日の達成率
  const ds=todayStr();
  const todayHabits=habits.filter(it=>scheduledToday(it));
  const todayPct=todayHabits.length?Math.round(todayHabits.filter(it=>isDone(it,ds)).length/todayHabits.length*100):0;
  // 7日達成率
  let sch=0,dn=0;
  for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const dd=dstr(d);
    habits.forEach(it=>{if(scheduledToday(it,dd)){sch++;if(isDone(it,dd))dn++;}});}
  const week=sch?Math.round(dn/sch*100):0;

  $("#statGrid").innerHTML=`
    <div class="stat-card"><div class="v">🔥${maxStreak}<small> 日</small></div><div class="l">最長ストリーク</div></div>
    <div class="stat-card"><div class="v">${todayPct}<small>%</small></div><div class="l">今日の達成率</div></div>
    <div class="stat-card"><div class="v">${week}<small>%</small></div><div class="l">直近7日の達成率</div></div>
    <div class="stat-card"><div class="v">${totalDone}<small> 回</small></div><div class="l">これまでの完了数</div></div>`;

  // calendar
  const y=calCursor.getFullYear(),m=calCursor.getMonth();
  $("#calLabel").textContent=`${y}年 ${m+1}月`;
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  let g="";
  for(let i=0;i<first;i++)g+=`<div class="cell pad"></div>`;
  for(let day=1;day<=days;day++){
    const dd=`${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    let sc=0,done=0;
    habits.forEach(it=>{if(scheduledToday(it,dd)){sc++;if(isDone(it,dd))done++;}});
    const isToday=dd===todayStr();
    let dot="";
    if(sc>0){const r=done/sc;const col=r===1?"var(--good)":r>0?"var(--gold)":"var(--line)";dot=`<span class="dot" style="background:${col}"></span>`;}
    const future=dd>todayStr();
    g+=`<div class="cell ${isToday?"today":""}" style="${future?'opacity:.35':''}">${day}${dot}</div>`;
  }
  $("#calGrid").innerHTML=g;

  // per-habit 30日達成率
  let ph="";
  habits.forEach(it=>{
    let s=0,d=0;
    for(let i=0;i<30;i++){const dt=new Date();dt.setDate(dt.getDate()-i);const dd=dstr(dt);if(scheduledToday(it,dd)){s++;if(isDone(it,dd))d++;}}
    const pc=s?Math.round(d/s*100):0;
    ph+=`<div class="per-row"><div class="em" style="background:${it.color}22;color:${it.color}">${it.emoji}</div>
      <div class="info"><div class="nm">${esc(it.name)}</div><div class="bar"><i style="width:${pc}%;background:${it.color}"></i></div></div>
      <div class="pc" style="color:${it.color}">${pc}%</div></div>`;
  });
  $("#perItem").innerHTML=habits.length?`<div class="sec-head"><h3>習慣別（直近30日）</h3></div>${ph}`:"";
}
$("#calPrev").onclick=()=>{calCursor.setMonth(calCursor.getMonth()-1);renderStats();};
$("#calNext").onclick=()=>{calCursor.setMonth(calCursor.getMonth()+1);renderStats();};

/* ---- tabs ---- */
$$(".tab").forEach(t=>t.onclick=()=>{
  $$(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");
  const tab=t.dataset.tab;
  $$(".screen").forEach(s=>s.classList.remove("active"));
  $("#s-"+tab).classList.add("active");
  $("#hTitle").textContent=tab==="today"?"今日":"統計";
  $("#fab").style.display=tab==="today"?"grid":"none";
  if(tab==="stats")renderStats();else renderToday();
});

/* ---- sheet ---- */
let editing=null, sel={type:"habit",emoji:EMOJIS[0],color:COLORS[0],repeat:"daily",dows:[0,1,2,3,4,5,6]};
function buildPickers(){
  $("#emojiPick").innerHTML=EMOJIS.map((e,i)=>`<button data-e="${e}" class="${e===sel.emoji?'on':''}">${e}</button>`).join("");
  $("#colorPick").innerHTML=COLORS.map(c=>`<button data-c="${c}" class="${c===sel.color?'on':''}" style="background:${c}"></button>`).join("");
  $("#dowPick").innerHTML=DOW.map((d,i)=>`<button data-d="${i}" class="${sel.dows.includes(i)?'on':''}">${d}</button>`).join("");
}
$("#emojiPick").onclick=e=>{const b=e.target.closest("[data-e]");if(!b)return;sel.emoji=b.dataset.e;buildPickers();};
$("#colorPick").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;sel.color=b.dataset.c;buildPickers();};
$("#dowPick").onclick=e=>{const b=e.target.closest("[data-d]");if(!b)return;const d=+b.dataset.d;
  if(sel.dows.includes(d))sel.dows=sel.dows.filter(x=>x!==d);else sel.dows.push(d);buildPickers();};
$("#typeSeg").onclick=e=>{const b=e.target.closest("[data-type]");if(!b)return;
  sel.type=b.dataset.type;$$("#typeSeg button").forEach(x=>x.classList.toggle("on",x===b));
  $("#repeatField").style.display=sel.type==="habit"?"block":"none";
  $("#dueField").style.display=sel.type==="task"?"block":"none";
};
function openSheet(){buildPickers();$("#mask").classList.add("open");$("#sheet").classList.add("open");}
function closeSheet(){$("#mask").classList.remove("open");$("#sheet").classList.remove("open");}
$("#mask").onclick=closeSheet;
$("#fab").onclick=()=>{
  editing=null;sel={type:"habit",emoji:EMOJIS[0],color:COLORS[0],repeat:"daily",dows:[0,1,2,3,4,5,6]};
  $("#sheetTitle").textContent="新しい習慣";$("#nameIn").value="";$("#dueIn").value="";
  $$("#typeSeg button").forEach(x=>x.classList.toggle("on",x.dataset.type==="habit"));
  $("#repeatField").style.display="block";$("#dueField").style.display="none";
  $("#delBtn").style.display="none";
  openSheet();
};
function openEdit(id){
  const it=state.items.find(x=>x.id===id);editing=id;
  sel={type:it.type,emoji:it.emoji,color:it.color,repeat:it.repeat,dows:it.repeat==="daily"?[0,1,2,3,4,5,6]:(Array.isArray(it.repeat)?[...it.repeat]:[0,1,2,3,4,5,6])};
  $("#sheetTitle").textContent="編集";$("#nameIn").value=it.name;$("#dueIn").value=it.due||"";
  $$("#typeSeg button").forEach(x=>x.classList.toggle("on",x.dataset.type===it.type));
  $("#repeatField").style.display=it.type==="habit"?"block":"none";
  $("#dueField").style.display=it.type==="task"?"block":"none";
  $("#delBtn").style.display="block";
  openSheet();
}
$("#saveBtn").onclick=()=>{
  const name=$("#nameIn").value.trim();
  if(!name){toast("名前を入力してね");$("#nameIn").focus();return;}
  let repeat="daily";
  if(sel.type==="habit"){
    if(sel.dows.length===0){toast("曜日を1つ以上選んでね");return;}
    repeat=sel.dows.length===7?"daily":[...sel.dows].sort();
  }
  if(editing){
    const it=state.items.find(x=>x.id===editing);
    it.name=name;it.emoji=sel.emoji;it.color=sel.color;it.type=sel.type;it.repeat=repeat;it.due=$("#dueIn").value||null;
  }else{
    state.items.push({id:"i"+Date.now()+Math.random().toString(36).slice(2,6),name,emoji:sel.emoji,color:sel.color,type:sel.type,repeat,due:sel.type==="task"?($("#dueIn").value||null):null,done:{},createdAt:todayStr()});
  }
  save();closeSheet();renderToday();
  toast(editing?"更新しました":"追加しました 🎉");
};
$("#delBtn").onclick=()=>{
  if(!editing)return;
  state.items=state.items.filter(x=>x.id!==editing);
  save();closeSheet();renderToday();toast("削除しました");
};

/* toast */
let tt;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1800);}

/* confetti micro */
function burst(el){
  const r=el.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;
  for(let i=0;i<8;i++){
    const c=document.createElement("div");c.className="confetti";
    c.style.background=COLORS[i%COLORS.length];c.style.left=cx+"px";c.style.top=cy+"px";
    document.body.appendChild(c);
    const ang=Math.random()*Math.PI*2,dist=30+Math.random()*40;
    c.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px) scale(0)`,opacity:0}],{duration:600,easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish=()=>c.remove();
  }
}
function celebrate(){
  for(let i=0;i<40;i++){
    const c=document.createElement("div");c.className="confetti";
    c.style.background=COLORS[i%COLORS.length];c.style.left=Math.random()*100+"vw";c.style.top="-20px";
    document.body.appendChild(c);
    c.animate([{transform:`translateY(0) rotate(0)`,opacity:1},{transform:`translateY(110vh) rotate(${Math.random()*720}deg)`,opacity:1}],{duration:1800+Math.random()*1200,easing:"cubic-bezier(.3,.6,.5,1)"}).onfinish=()=>c.remove();
  }
  toast("今日のノルマ達成！ 🎉");
}

/* date header */
function setDate(){const d=new Date();$("#hDate").textContent=`${d.getMonth()+1}月${d.getDate()}日 (${DOW[d.getDay()]})`;}

/* seed sample on first launch */
if(!localStorage.getItem("kotsu_v1")){
  state.items=[
    {id:"seed1",name:"水を飲む",emoji:"💧",color:COLORS[4],type:"habit",repeat:"daily",due:null,done:{},createdAt:todayStr()},
    {id:"seed2",name:"運動する",emoji:"🏃",color:COLORS[1],type:"habit",repeat:"daily",due:null,done:{},createdAt:todayStr()},
    {id:"seed3",name:"読書",emoji:"📚",color:COLORS[0],type:"habit",repeat:[1,2,3,4,5],due:null,done:{},createdAt:todayStr()},
  ];
  save();
}

applyTheme();setDate();renderToday();

/* service worker */
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
